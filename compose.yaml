services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  user-service:
    build: ./user-service
    ports:
      - "3000:3000"
    env_file:
      - ./user-service/.env

  vehicle-service:
    build: ./vehicle-service
    ports:
      - "3001:3001"
    env_file:
      - ./vehicle-service/.env

  frontend:
    build: ./frontend
    depends_on:
      - user-service
      - vehicle-service

volumes:
  caddy_data:
  caddy_config:
